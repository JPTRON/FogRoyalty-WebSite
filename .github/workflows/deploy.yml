name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to nginx
        run: |
          rm -rf /var/www/fogRoyalty/dist
          cp -r dist /var/www/fogRoyalty/dist
          systemctl reload nginx